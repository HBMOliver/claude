  <script>
    const tl = gsap.timeline({ paused: true });
    const tall = window.innerHeight > window.innerWidth;
    const n = 6, step = 0.5, swap = 0.3;
    tl.fromTo("#sv-ph", { opacity: 0, x: tall ? 0 : 220, y: tall ? 300 : 0 }, { opacity: 1, x: 0, y: 0, duration: 0.7, ease: "expo.out" }, 0);
    tl.fromTo("#sv-n0", { yPercent: 130 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.05);
    for (let i = 1; i < n; i++) tl.fromTo(`#sv-n${i}`, { yPercent: 130 }, { yPercent: 130, duration: 0.01 }, 0);
    for (let i = 1; i < n; i++) tl.fromTo(`#sv-s${i}`, { yPercent: 100 }, { yPercent: 100, duration: 0.01 }, 0);
    for (let i = 0; i < n; i++) {
      tl.fromTo(`#sv-b${i}`, { scaleX: 0 }, { scaleX: 1, duration: step, ease: "none" }, i * step);
      if (i === 0) continue;
      const at = i * step - 0.08;
      // the reel before goes up and out, the next one comes up from below, as on a phone
      tl.fromTo(`#sv-s${i - 1}`, { yPercent: 0 }, { yPercent: -100, duration: swap, ease: "expo.out", immediateRender: false }, at);

      tl.set("#sv-c", { textContent: String(i + 1).padStart(2, "0") }, at + 0.05);
