  <style>

@font-face { font-family: "Sora"; src: url("assets/fonts/sora-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-style: normal; }

#root { position: absolute; inset: 0; overflow: hidden; color: #eef1f8; font-family: Inter, sans-serif; }
/* a full-frame layer: what a camera move scales about the frame's centre */
#root .ff { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#root .hd { font-family: Sora, Inter, sans-serif; font-weight: 700; letter-spacing: -0.045em; line-height: 1.02; color: #eef1f8; }
#root .it { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: 0; color: #d9d6ff; }

  <!-- the aurora behind the whole film: four lights drifting on closed paths, so the last frame meets the first -->
  <div id="root" data-composition-id="sky" data-width="1080" data-height="1920">
    <i class="sk-b" id="sk-b1"></i>
    <i class="sk-b" id="sk-b2"></i>
    <i class="sk-b" id="sk-b3"></i>
    <i class="sk-b" id="sk-b4"></i>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 35.4, third = D / 3;
    // each light visits two points and comes home; vmax is 1920 px in both cuts
    const paths = {
      "#sk-b1": [[0, 0, 1], [170, -110, 1.14], [-120, 70, 0.94]],
      "#sk-b2": [[0, 0, 1], [-150, -80, 0.9], [110, 60, 1.12]],
      "#sk-b3": [[0, 0, 1], [210, -40, 1.2], [-180, 30, 0.9]],
      "#sk-b4": [[0, 0, 1], [-130, 90, 1.1], [90, -50, 0.92]],
    };
    for (const [sel, p] of Object.entries(paths)) {
      for (let k = 0; k < 3; k++) {
        const a = p[k], b = p[(k + 1) % 3];
        tl.fromTo(sel, { x: a[0], y: a[1], scale: a[2] }, { x: b[0], y: b[1], scale: b[2], duration: third, ease: "sine.inOut", immediateRender: k === 0 }, k * third);
      }
    }
    window.__timelines["sky"] = tl;
  </script>
