#root { position: absolute; inset: 0; overflow: hidden; color: #eef1f8; font-family: Inter, sans-serif; }

  <script>
    const tl = gsap.timeline({ paused: true });
    const tall = window.innerHeight > window.innerWidth;
    const away = "left" === "right" ? 1 : -1;
    ["#mft-q1", "#mft-q2", "#mft-q3"].forEach((q, i) => {
      tl.fromTo(q, { y: tall ? 80 : 60 + i * 20, opacity: 0, scale: 0.96 }, { y: tall ? 0 : [16, -22, 16][i], opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, i * 0.07);

    // the count: 79, in 1.4 s, then it holds
    const c = { v: 0 }, el = document.getElementById("mft-num");
    tl.fromTo(c, { v: 0 }, { v: 79, duration: 1.4, ease: "power2.out", onUpdate: () => { el.textContent = Math.round(c.v); } }, 0.1);
    tl.fromTo("#mft-lab", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" }, 0.28);
    tl.fromTo("#mft-eb", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.38);
    tl.fromTo("#mft-in", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.in" }, 2.28);
    window.__timelines["mft"] = tl;
