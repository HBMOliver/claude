<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SocialStream brand film (1920x1080, en)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070f; }
      #main { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- motion blur at render time: fast moves (swipes, the phone growing, the stream) are smeared along their path -->
    <div id="main" data-motion-blur="on" data-composition-id="main" data-start="0" data-duration="35.4" data-fps="25" data-width="1920" data-height="1080">
      <div
        id="sky"
        data-composition-id="sky"
        data-composition-src="compositions/sky.html"
        data-start="0"
        data-duration="35.4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 0"
      ></div>
      <div
        id="open"
        data-composition-id="open"
        data-composition-src="compositions/open.html"
        data-start="0"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="claim"
        data-composition-id="claim"
        data-composition-src="compositions/claim.html"
        data-start="3.8"
        data-duration="5.55"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="flyx"
        data-composition-id="flyx"
        data-composition-src="compositions/flyx.html"
        data-start="11.3"
        data-duration="3.1"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="wall"
        data-composition-id="wall"
        data-composition-src="compositions/wall.html"
        data-start="31.75"
        data-duration="3.65"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>
      <div
        id="feed"
        data-composition-id="feed"
        data-composition-src="compositions/feed.html"
        data-start="8.9"
        data-duration="22.85"
        data-track-index="5"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 5"
      ></div>
      <div
        id="stream"
        data-composition-id="stream"
        data-composition-src="compositions/stream.html"
        data-start="8.9"
        data-duration="2.4"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 6"
      ></div>
      <div
        id="side"
        data-composition-id="side"
        data-composition-src="compositions/side.html"
        data-start="20.1"
        data-duration="6.35"
        data-track-index="7"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 7"
      ></div>
      <div
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="0"
        data-duration="4"
        data-track-index="8"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 8"
      ></div>
      <div
        id="close"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="32.55"
        data-duration="2.85"
        data-track-index="9"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 9"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
