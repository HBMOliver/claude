<template>
  <style>
    /*COMMON*/
    /*WALLCSS*/
    #cs-logo { position: absolute; }
  </style>
  <!-- the close: the wall comes back with the logo on the band; at the end the wall and the logo go, and only the band
       and the dimming are left, which is how the film's first frame looks, so the loop on the site has no jump -->
  <div id="root" data-composition-id="close" data-width="%W%" data-height="%H%">
    <div class="wl-in" data-layout-allow-overflow id="cs-in">
      <div class="wl-tilt"><div class="wl-wall" id="cs-wall"><!--WALL--></div></div>
    </div>
    <div class="wl-dim" id="cs-dim"></div>
    <div class="wl-band" id="cs-band"></div>
    <img id="cs-logo" src="assets/logo/socialstream-logo-stacked-dark.svg" alt="SocialStream" style="%LOGOBOX%">
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(["#cs-dim", "#cs-band"], { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);
    tl.fromTo("#cs-wall .wl-card", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out", stagger: { grid: [%ROWS%, %COLS%], from: "center", amount: 0.8 } }, 0.05);
    tl.fromTo("#cs-wall", { x: 60 }, { x: 0, duration: 3.4, ease: "none" }, 0);
    // the logo as one piece, as the kit asks: a fade and a 4 % scale
    tl.fromTo("#cs-logo", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, 0.3);
    // out to the band alone (the film's first frame)
    tl.fromTo("#cs-logo", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, 2.75);
    tl.fromTo("#cs-in", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.in" }, 2.85);
    window.__timelines["close"] = tl;
  </script>
</template>
