<template>
  <style>
    /*COMMON*/
    /*WALLCSS*/
    #cs-logo { position: absolute; }
  </style>
  <!-- the close: the dimming and the night band come up over the wall and the logo stands on the band; then the logo
       goes (and the wall, in compositions/wall.html), leaving the band and the dimming: the film's first frame, so
       the loop on the site has no jump -->
  <div id="root" data-composition-id="close" data-width="%W%" data-height="%H%">
    <div class="wl-dim" id="cs-dim"></div>
    <div class="wl-band" id="cs-band"></div>
    <img id="cs-logo" src="assets/logo/socialstream-logo-stacked-dark.svg" alt="SocialStream" style="%LOGOBOX%">
  </div>
  <script>
  (() => {
    /*COMMONJS*/
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(["#cs-dim", "#cs-band"], { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);
    // the logo as one piece, as the kit asks: a fade and a 4 % scale
    tl.fromTo("#cs-logo", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.7, ease: "expo.out" }, AT(TM.logoIn));
    tl.fromTo("#cs-logo", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in", immediateRender: false }, AT(TM.logoOut));
    window.__timelines["close"] = tl;
  })();
  </script>
</template>
