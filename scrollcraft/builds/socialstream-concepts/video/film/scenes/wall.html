<template>
  <style>
    /*COMMON*/
    /*WALLCSS*/
    #wa-rot { transform-origin: 50% 50%; }
    #wa-card { position: absolute; inset: 0; overflow: hidden; }
    #wa-shadow { position: absolute; left: 0; top: 0; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 30px 60px -30px rgba(0, 0, 0, 0.8); background: #0b1024; }
  </style>
  <!-- back out of the phone: the full frame shrinks and turns into the middle of the reel wall, which flies in around
       it; this is the opening's wall, so the close (compositions/close.html) can end where the film began -->
  <div id="root" data-composition-id="wall" data-width="%W%" data-height="%H%">
    <div class="wl-in ff" data-layout-allow-overflow id="wa-in">
      <div class="wl-tilt"><div class="wl-wall" id="wa-wall"><!--WALL--></div></div>
      <div class="ff" id="wa-rot">
        <div id="wa-shadow"></div>
        <div id="wa-card">%HERO%</div>
      </div>
    </div>
  </div>
  <script>
  (() => {
    /*COMMONJS*/
    const tl = gsap.timeline({ paused: true });
    const HERO = %HERODATA%;            // the footage's box size
    const SLOT = %SLOT%;                // the wall's middle card: size, radius, tilt; the wall's drift
    const drift = (t) => SLOT.x0 * clamp01((TM.total - t) / (TM.total - TM.back));
    const card = document.getElementById("wa-card"), media = document.getElementById("wa-m");
    const rot = document.getElementById("wa-rot"), shadow = document.getElementById("wa-shadow");
    const wallEl = document.getElementById("wa-wall"), r2 = (v) => +v.toFixed(2);
    const draw = (t, put) => {
      const p = ez("power3.inOut", (t - TM.back) / TM.backd);
      // the slot, in the turned layer's own coordinates: the wall's middle, moved by the wall's drift
      const slot = { cx: CX + drift(t), cy: CY, w: SLOT.w, h: SLOT.h, r: SLOT.r };
      const R = mixRect({ cx: CX, cy: CY, w: W, h: H, r: 0 }, slot, p);
      put(rot, "rotation", +(SLOT.tilt * p).toFixed(4));
      put(card, "clipPath", insetOf(R));
      put(shadow, "x", r2(R.cx - R.w / 2)); put(shadow, "y", r2(R.cy - R.h / 2));
      put(shadow, "width", r2(R.w)); put(shadow, "height", r2(R.h)); put(shadow, "borderRadius", r2(R.r));
      put(shadow, "opacity", +p.toFixed(4));
      const c = coverAt(HERO.bw, HERO.bh, R, HERO.fx, HERO.fy, 0);
      put(media, "x", r2(c.x)); put(media, "y", r2(c.y)); put(media, "scale", +c.z.toFixed(5));
      put(wallEl, "x", r2(drift(t)));
    };
    bake(tl, TM.back, TM.total, draw);
    // the other reels fly in around it, from the middle outwards
    tl.fromTo("#wa-wall .wl-card", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out", stagger: { grid: [%ROWS%, %COLS%], from: "center", amount: 0.8 } }, AT(TM.back + 0.15));
    // the wall goes, so only the band is left: the film's first frame
    tl.fromTo("#wa-in", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.in", immediateRender: false }, AT(TM.wallOut));
    window.__timelines["wall"] = tl;
  })();
  </script>
</template>
