  <div id="root" data-composition-id="open" data-width="%W%" data-height="%H%">
    <div class="wl-in" data-layout-allow-overflow id="op-in">
      <div class="wl-tilt"><div class="wl-wall" id="op-wall"><!--WALL--></div></div>
      <div class="wl-dim"></div>

    </div>

    const tl = gsap.timeline({ paused: true });
    // the reels fly in from the middle outwards
    tl.fromTo("#op-wall .wl-card", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out", stagger: { grid: [%ROWS%, %COLS%], from: "center", amount: 0.8 } }, 0.05);
