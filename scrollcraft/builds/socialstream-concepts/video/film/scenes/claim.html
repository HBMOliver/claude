<template>
  <style>
    /*COMMON*/
    /* each line is drawn once per word, every copy laid out the same, each copy showing one word: so each word can
       come from depth on its own, scaling about the frame's centre like something the camera flies towards */
    #root .cl-txt { position: absolute; left: 192px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
    #root .cl-txt .hd { font-size: 150px; white-space: nowrap; }
    #root .w { display: inline-block; }
    #root .w.off { visibility: hidden; }
    #root .w.ghost { visibility: hidden; }
    #root .cl-a2 { margin: 6px 0 0 520px; font-size: 280px; line-height: 0.95; white-space: nowrap; }
    #root .cl-b1 .it { font-size: 1.28em; line-height: 0.9; }
    #root .cl-b2 { margin-top: 0.12em; }
    /* the strike: a red-pink bar painted behind "social media", one per line when the words wrap */
    #root .ss { -webkit-box-decoration-break: clone; box-decoration-break: clone; }
    #root .strike .ss { background: linear-gradient(#ff5272, #ff5272) no-repeat 0 0.53em / 0% 0.09em; }
    #root br.t { display: none; }
    @media (orientation: portrait) {
      #root .cl-txt { left: 100px; }
      #root .cl-txt .hd { font-size: 148px; }
      #root .cl-a2 { margin: 10px 0 0 60px; font-size: 240px; }
      #root .cl-b1 .it { font-size: 1.22em; }
      #root br.t { display: inline; }
    }
  </style>
  <!-- the claim, the film's own words: social media is dead, interest took its place -->
  <div id="root" data-composition-id="claim" data-width="%W%" data-height="%H%">
    <div class="ff" id="cl-a">%LINEA%</div>
    <div class="ff" id="cl-b">%LINEB%</div>
  </div>
  <script>
  (() => {
    /*COMMONJS*/
    const tl = gsap.timeline({ paused: true });
    // a word arrives from depth: it grows from 42 % about the frame's centre while it sharpens
    const arrive = (sel, at) => tl.fromTo(sel, { scale: 0.42, opacity: 0, filter: "blur(12px)" },
      { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, AT(at));
    // a line flies past the camera
    const past = (sel, at) => tl.fromTo(sel, { scale: 1, opacity: 1, filter: "blur(0px)" },
      { scale: 3.2, opacity: 0, filter: "blur(18px)", duration: 0.4, ease: "power3.in", immediateRender: false }, AT(at));
    // "A social media", struck through, "meghalt." (English: "Social media", struck through, "is dead.")
    for (let k = 0; k < %NA%; k++) arrive(`#cl-a${k}`, TM.claim + k * 0.07);
    tl.fromTo("#cl-as .ss", { backgroundSize: "0% 0.09em" }, { backgroundSize: "100% 0.09em", duration: 0.36, ease: "expo.inOut" }, AT(TM.strike));
    tl.fromTo("#cl-a%NA%", { y: -60, opacity: 0, filter: "blur(14px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, AT(TM.meghalt));
    past("#cl-a", TM.claA_out);
    // "Az érdeklődés vette át a helyét." (English: "Interest has taken its place.")
    for (let k = 0; k < %NB%; k++) arrive(`#cl-b${k}`, TM.claB + k * 0.07);
    past("#cl-b", TM.claB_out);
    window.__timelines["claim"] = tl;
  })();
  </script>
</template>
