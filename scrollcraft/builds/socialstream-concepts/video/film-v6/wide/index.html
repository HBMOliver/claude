<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>SocialStream brand film v6 (1920x1080, hu)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070f; }
      #main { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <!-- motion blur at render time, with a short shutter (100 degrees, not the default 240): the swipes, the dive and
         the back-out carry a light smear along their path; type only lands by focus and opacity, so it is never
         smeared in place -->
    <div id="main" data-motion-blur="on" data-motion-blur-shutter="100" data-composition-id="main" data-start="0" data-duration="22.52" data-fps="25" data-width="1920" data-height="1080">
      <div
        id="open"
        data-composition-id="open"
        data-composition-src="compositions/open.html"
        data-start="0"
        data-duration="2.3"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 0"
      ></div>
      <div
        id="close"
        data-composition-id="close"
        data-composition-src="compositions/close.html"
        data-start="19.12"
        data-duration="3.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="feed"
        data-composition-id="feed"
        data-composition-src="compositions/feed.html"
        data-start="1.9"
        data-duration="17.22"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>
      <div
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="19.52"
        data-duration="3"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
