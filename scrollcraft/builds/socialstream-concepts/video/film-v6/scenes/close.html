<template>
  <style>
    /*COMMON*/
    /*WALLCSS*/
    #cs-card { position: absolute; inset: 0; overflow: hidden; }
    #cs-shadow { position: absolute; left: 0; top: 0; background: #0b1024;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 30px 60px -30px rgba(0, 0, 0, 0.8); }
  </style>
  <!-- back out of the phone: the full frame (the sunset, still playing) shrinks and turns into the middle of the reel
       wall, which flies in around it; the night glow comes up where the logo builds itself (compositions/logo.html,
       above this one). The last frame is the film's first. -->
  <div id="root" data-composition-id="close" data-width="%W%" data-height="%H%">
    <div class="wl-in ff" data-layout-allow-overflow id="cs-in">
      <div class="wl-tilt"><div class="wl-wall" id="cs-wall"><!--WALL--></div></div>
      <div class="ff" id="cs-rot">
        <div id="cs-shadow"></div>
        <div id="cs-card">%HERO%</div>
      </div>
      <div class="wl-dim" id="cs-dim"></div>
    </div>
    <div class="glow" id="cs-glow"></div>
  </div>
  <script>
  (() => {
    /*COMMONJS*/
    const tl = gsap.timeline({ paused: true });
    const HERO = %HERODATA%;            // the footage's box size and focus
    const SLOT = %SLOT%;                // the wall's middle card: size, radius, tilt
    const drift = (t) => TM.wallV * (TM.total - t);    // 0 on the last frame, where the opening starts
    const card = document.getElementById("cs-card"), media = document.getElementById("cs-m");
    const rot = document.getElementById("cs-rot"), shadow = document.getElementById("cs-shadow");
    const wallEl = document.getElementById("cs-wall"), r2 = (v) => +v.toFixed(2);
    tl.set(rot, { transformOrigin: "50% 50%" }, 0);
    const draw = (t, put) => {
      const p = ez("power3.inOut", (t - TM.back) / TM.backd);
      // the slot, in the turned layer's own coordinates: the wall's middle, moved by the wall's drift
      const slot = { cx: CX + drift(t), cy: CY, w: SLOT.w, h: SLOT.h, r: SLOT.r };
      const R = mixRect({ cx: CX, cy: CY, w: W, h: H, r: 0 }, slot, p);
      put(rot, "rotation", +(SLOT.tilt * p).toFixed(4));
      put(card, "clipPath", insetOf(R));
      put(shadow, "x", r2(R.cx - R.w / 2)); put(shadow, "y", r2(R.cy - R.h / 2));
      put(shadow, "width", r2(R.w)); put(shadow, "height", r2(R.h)); put(shadow, "borderRadius", r2(R.r));
      put(shadow, "opacity", +p.toFixed(4));
      const c = coverAt(HERO.bw, HERO.bh, R, HERO.fx, HERO.fy, 0);
      put(media, "x", r2(c.x)); put(media, "y", r2(c.y)); put(media, "scale", +c.z.toFixed(5));
      put(wallEl, "x", r2(drift(t)));
    };
    bake(tl, TM.back, TM.total, draw);
    // the other reels fly in around it, from the middle outwards
    tl.fromTo("#cs-wall .wl-card", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out",
      stagger: { grid: [%ROWS%, %COLS%], from: "center", amount: 0.7 } }, AT(TM.back + 0.15));
    // the wall's dimming and the glow behind the logo come up, as the opening has them
    tl.fromTo("#cs-dim", { opacity: 0 }, { opacity: 1, duration: TM.backd, ease: "power2.inOut" }, AT(TM.back));
    tl.fromTo("#cs-glow", { opacity: 0 }, { opacity: 1, duration: TM.glowd, ease: "power2.out" }, AT(TM.glow));
    window.__timelines["close"] = tl;
  })();
  </script>
</template>
