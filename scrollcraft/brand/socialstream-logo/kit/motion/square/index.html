<!doctype html>
<html lang="en" data-composition-variables='[{"id": "night", "type": "color", "label": "Ground (Night)", "default": "#05070F"}, {"id": "cream", "type": "color", "label": "Phone and SOCIAL (Cream)", "default": "#F1EEE6"}, {"id": "stream", "type": "color", "label": "STREAM (Stream Blue)", "default": "#7FA1C4"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>SocialStream logo animation (square)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--night, #05070F);
      }
      #main {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-start="0"
      data-duration="4.6"
      data-width="1080"
      data-height="1080"
    >
      <div
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="0"
        data-duration="4.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
